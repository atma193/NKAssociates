<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect People</title>
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#262626;--mut:#6a6a6a;--pri:#b34700;--pri2:#fde5d0;--ok:#1b7f45;--okbg:#e4f5ea;--red:#c62828;--redbg:#fde8e8;--line:#e9ddcd;--fs:16px}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Devanagari","Mukta","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:78px;font-size:var(--fs)}
header{background:var(--pri);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{margin:0;font-size:1.25em}
header p{margin:2px 0 0;font-size:.8em;opacity:.92}
header .hb{display:flex;gap:6px}
header button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:8px;padding:8px 10px;font-family:inherit;font-size:.85em;font-weight:700;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 2px;font-size:.78em;color:var(--mut);font-family:inherit}
nav button b{display:block;font-size:1.5em;font-weight:400}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.urg{border-left:5px solid var(--red)}
.card.done{opacity:.7;border-left:5px solid var(--ok)}
.card h3{margin:0 0 4px;font-size:1.05em}
.mut{color:var(--mut);font-size:.82em}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:20px;padding:2px 10px;font-size:.78em;margin:2px 4px 2px 0}
.tag.g{background:var(--okbg);color:var(--ok)}
.tag.r{background:var(--redbg);color:var(--red);font-weight:700}
input,select,textarea{width:100%;padding:10px;border:1px solid #d6c8b5;border-radius:8px;font-size:1em;font-family:inherit;margin:4px 0 10px;background:#fff}
label{font-size:.82em;color:var(--mut)}
.btn{display:inline-block;border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:8px;font-size:1em;font-family:inherit;text-decoration:none;cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.wa{background:#25d366}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;font-size:.85em}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.hero{background:linear-gradient(135deg,#fde5d0,#fff3e6);border-radius:14px;padding:14px;margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border:1px solid var(--pri);background:#fff;color:var(--pri);border-radius:8px;font-family:inherit;font-size:.9em}
.seg button.on{background:var(--pri);color:#fff}
.resp{background:#f4f9ff;border-left:4px solid #1565c0;padding:8px;border-radius:6px;margin-top:8px;font-size:.85em}
.match{background:#f1faf4;border-left:4px solid var(--ok);padding:8px;border-radius:6px;margin-top:8px;font-size:.85em}
.warn{background:#fff6dd;border-left:4px solid #e0a100;padding:8px;border-radius:6px;margin-bottom:10px;font-size:.85em}
.mic{background:var(--pri2);color:var(--pri);border:0;border-radius:8px;padding:6px 12px;font-family:inherit;font-size:.85em}
.mic.rec{background:var(--red);color:#fff}
.badge{display:inline-block;font-size:.8em;margin-right:10px}
</style>
</head>

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clean=p=>String(p||"").replace(/\D/g,"");
const uid=()=>"x"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ME=()=>ST.profiles[CU];
const K=()=>!!(ME()&&ME().kind==="city");
const same=(a,b)=>!a||!b||String(a).trim().toLowerCase()===String(b).trim().toLowerCase();
const loc=p=>[p.area,p.place].filter(Boolean).join(", ");
const vouchN=id=>ST.vouches.filter(v=>v.to===id).length;
const thanksN=id=>ST.thanks.filter(x=>x.helper===id).length;
const blocked=()=>(ME()&&ME().blocked)||[];
function wa(phone,msg){const n=clean(phone);return "https://wa.me/"+(n.length===10?"91"+n:n)+"?text="+encodeURIComponent(msg||t("waHello"))}
function bigger(){fs=(fs+1)%3;document.documentElement.style.setProperty("--fs",["16px","19px","22px"][fs]);try{localStorage.setItem(FK,fs)}catch(e){}}
function toggleLang(){lang=lang==="en"?"mr":"en";try{localStorage.setItem(LK,lang)}catch(e){}render()}
async function guard(fn){try{await fn()}catch(e){alert(t("err")+" "+(e.message||e))}}

/* ---------- demo-mode storage ---------- */
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d){ST={...ST,...d.st};return d.session||null}}catch(e){}return null}
function persist(session){try{localStorage.setItem(KEY,JSON.stringify({st:{profiles:ST.profiles,posts:ST.posts,vouches:ST.vouches,thanks:ST.thanks,reports:ST.reports},session:session===undefined?CU:session}))}catch(e){}}

/* ---------- data layer (online Firestore or demo localStorage) ---------- */
async function wProfile(o){
  ST.profiles[CU]={...(ST.profiles[CU]||{}),...o};
  if(ONLINE)await db.collection("users").doc(CU).set(o,{merge:true});else persist();
}
async function wPostAdd(o){
  if(ONLINE)await db.collection("posts").add(o);else{ST.posts.push({id:uid(),...o});persist()}
}
async function wPostUpd(id,patch){
  const p=ST.posts.find(x=>x.id===id);if(p)Object.assign(p,patch);
  if(ONLINE)await db.collection("posts").doc(id).update(patch);else persist();
}
async function wPostDel(id){
  ST.posts=ST.posts.filter(x=>x.id!==id);
  if(ONLINE)await db.collection("posts").doc(id).delete();else persist();
}
async function wRespond(id,r){
  const p=ST.posts.find(x=>x.id===id);if(p)p.responders=(p.responders||[]).concat(r);
  if(ONLINE)await db.collection("posts").doc(id).update({responders:firebase.firestore.FieldValue.arrayUnion(r)});else persist();
}
async function wVouch(to,on){
  const id=CU+"_"+to;
  ST.vouches=ST.vouches.filter(v=>!(v.from===CU&&v.to===to));
  if(on)ST.vouches.push({from:CU,to,t:Date.now()});
  if(ONLINE){const r=db.collection("vouches").doc(id);if(on)await r.set({from:CU,to,t:Date.now()});else await r.delete()}else persist();
}
async function wThanks(post,helper){
  ST.thanks.push({post,helper,by:CU,t:Date.now()});
  if(ONLINE)await db.collection("thanks").doc(post).set({post,helper,by:CU,t:Date.now()});else persist();
}
async function wReport(o){
  if(ONLINE)await db.collection("reports").add(o);else{ST.reports.push({id:uid(),...o});persist()}
}
async function wReportDel(id){
  ST.reports=ST.reports.filter(r=>r.id!==id);
  if(ONLINE)await db.collection("reports").doc(id).delete();else persist();
}
async function wUserDel(id){
  delete ST.profiles[id];
  if(ONLINE)await db.collection("users").doc(id).delete();else persist();
}

/* ---------- live listeners ---------- */
function soft(){
  const a=document.activeElement;
  if(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName))return;
  if(tab==="new"||(tab==="me"&&editing))return;
  render();
}
function startListeners(){
  stopListeners();ready=false;
  const sub=(qy,cb)=>unsubs.push(qy.onSnapshot(cb,e=>console.error(e)));
  sub(db.collection("users"),s=>{const m={};s.forEach(d=>m[d.id]=d.data());ST.profiles=m;ready=true;soft()});
  sub(db.collection("posts").where("exp",">",Date.now()),s=>{ST.posts=s.docs.map(d=>({id:d.id,...d.data()}));soft()});
  sub(db.collection("vouches"),s=>{ST.vouches=s.docs.map(d=>d.data());soft()});
  sub(db.collection("thanks"),s=>{ST.thanks=s.docs.map(d=>d.data());soft()});
  db.collection("admins").doc(CU).get().then(d=>{
    ST.admin=d.exists;
    if(d.exists)sub(db.collection("reports"),s=>{ST.reports=s.docs.map(x=>({id:x.id,...x.data()}));soft()});
    soft();
  }).catch(()=>{});
}
function stopListeners(){unsubs.forEach(u=>u());unsubs=[]}

/* ---------- login ---------- */
async function signInAnon(){try{await auth.signInAnonymously()}catch(e){alert(t("err")+" "+e.message)}}
async function sendOtp(){
  const n=clean($("#lp").value);
  if(n.length!==10){alert(t("badPhone"));return}
  loginPhone=n;
  if(!ONLINE){loginStep=1;render();return}
  try{
    try{rv&&rv.clear()}catch(e){}
    rv=new firebase.auth.RecaptchaVerifier("recaptcha",{size:"invisible"});
    conf=await auth.signInWithPhoneNumber("+91"+n,rv);
    loginStep=1;render();
  }catch(e){alert(t("otpFail")+" "+e.message)}
}
async function verifyOtp(){
  const c=$("#lo").value.trim();
  if(!ONLINE){
    if(c!=="123456"){alert(t("badOtp"));return}
    CU="u"+loginPhone;persist();loginStep=0;render();return;
  }
  try{await conf.confirm(c)}catch(e){alert(t("badOtp"))}
}
function signOut(){
  if(ONLINE)auth.signOut();else{CU=null;persist(null);loginStep=0;render()}
}
async function delAccount(){
  if(!confirm(t("delConfirm")))return;
  try{
    if(ONLINE){
      const s=await db.collection("posts").where("by","==",CU).get();
      const b=db.batch();s.forEach(d=>b.delete(d.ref));b.delete(db.collection("users").doc(CU));await b.commit();
      try{await auth.currentUser.delete()}catch(e){await auth.signOut()}
    }else{ST.posts=ST.posts.filter(p=>p.by!==CU);delete ST.profiles[CU];persist(null);CU=null}
  }catch(e){alert(t("err")+" "+e.message)}
  tab="feed";editing=false;render();
}

/* ---------- needs feed ---------- */
function feed(){
  const m=ME(),bl=blocked(),now=Date.now(),c=K()?"c":"v";
  let L=ST.posts.filter(p=>p.exp>now&&!bl.includes(p.by));
  if(scope==="area")L=L.filter(p=>same(p.area,m.area)&&same(p.place,m.place));
  else if(scope==="place")L=L.filter(p=>same(p.place,m.place));
  L.sort((a,b)=>(!!a.done-!!b.done)||((URG[a.urg]||9)-(URG[b.urg]||9))||(b.t-a.t));
  const empty=scope==="area"
    ?`<div class="card mut">${t("emptyArea")}<div class="row"><button class="btn sec sm" onclick="scope='place';render()">${t("seeWhole_"+c)}</button></div></div>`
    :`<div class="card mut">${t("noPosts")}</div>`;
  return `<div class="hero"><b>${t("today")}, ${esc(m.name)}</b><div class="mut">${t("feedNote")}</div>${K()?`<div class="mut" style="margin-top:6px">${t("safety")}</div>`:""}</div>
  <div class="seg"><button class="${scope==='area'?'on':''}" onclick="scope='area';render()">📍 ${t("scArea_"+c)}</button><button class="${scope==='place'?'on':''}" onclick="scope='place';render()">🏘 ${t("scPlace_"+c)}</button><button class="${scope==='all'?'on':''}" onclick="scope='all';render()">🌐 ${t("scAll")}</button></div>
  ${L.map(postCard).join("")||empty}`;
}
function postCard(p){
  const mine=p.by===CU,now=Date.now(),opp=p.type==="need"?"offer":"need";
  const mt=ST.posts.filter(x=>x.id!==p.id&&x.exp>now&&!x.done&&x.type===opp&&x.cat===p.cat&&same(x.place,p.place)&&!blocked().includes(x.by));
  const hn=p.helper&&ST.profiles[p.helper]?ST.profiles[p.helper].name:"";
  const resp=p.responders||[];
  const h=Math.max(0,Math.round((p.exp-now)/36e5));
  const left=h>=48?Math.round(h/24)+" "+t("daysLeft"):h+" "+t("hrsLeft");
  return `<div class="card ${p.done?'done':(p.urg==='now'?'urg':'')}">
  ${p.done?`<span class="tag g">${t("doneTag")}</span>`:`<span class="tag ${p.urg==='now'?'r':''}">${t(UL[p.urg]||"urgToday")}</span>`}<span class="tag">${p.type==="need"?t("needTag"):t("offerTag")}</span><span class="tag g">${esc(nm(CATS,p.cat))}</span>
  <div style="margin:6px 0">${esc(p.text)}</div>
  <div class="mut">— ${esc(p.byName)}${vouchN(p.by)?` · 🤝 ${vouchN(p.by)}`:(K()?` · 🆕 ${t("newMember")}`:"")} · 📍 ${esc(loc(p))}${p.done?"":" · ⏳ "+left}</div>
  ${p.done&&hn?`<div class="mut">${t("helpedBy")} <b>${esc(hn)}</b></div>`:""}
  <div class="row"><button class="mic" onclick="speak('${p.id}')">${t("listen")}</button>
  ${!p.done&&!mine?`${p.type==="need"?`<button class="btn ok sm" onclick="helpOn('${p.id}')">${t("helpBtn")}</button>`:""}<a class="btn wa sm" target="_blank" rel="noopener" href="${wa(p.phone,t("waPost")+p.text)}">WhatsApp</a>`:""}
  ${mine&&!p.done?`<button class="btn sm" onclick="closePost('${p.id}')">${t("markDone")}</button>`:""}
  ${mine?`<button class="btn sec sm" onclick="delPost('${p.id}')">${t("del")}</button>`:`<button class="btn sec sm" onclick="reportPost('${p.id}')">${t("report")}</button><button class="btn sec sm" onclick="blockUser('${p.by}')">${t("block")}</button>`}</div>
  ${mine&&!p.done&&resp.length?`<div class="resp">${t("respLbl")} ${resp.map(r=>esc(r.name)).join(", ")}</div>`:""}
  ${mt.length&&!p.done?`<div class="match">🔗 <b>${t("matches")} (${mt.length}):</b> ${mt.map(x=>esc(x.byName)).join(", ")}</div>`:""}</div>`;
}
function speak(id){
  const p=ST.posts.find(x=>x.id===id);
  if(!p||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(nm(CATS,p.cat)+". "+p.text);u.lang=lang==="mr"?"mr-IN":"en-IN";speechSynthesis.speak(u);
}
function helpOn(id){
  const p=ST.posts.find(x=>x.id===id);if(!p)return;
  window.open(wa(p.phone,"Hello, I am "+ME().name+". I can help with your post: "+p.text),"_blank");
  if((p.responders||[]).some(r=>r.id===CU))return;
  guard(()=>wRespond(id,{id:CU,name:ME().name})).then(render);
}
async function closePost(id){
  const p=ST.posts.find(x=>x.id===id);if(!p)return;
  let h=null;const resp=p.responders||[];
  if(resp.length){
    const a=prompt(t("pickHelper")+"\n"+resp.map((r,i)=>(i+1)+") "+r.name).join("\n"));
    const r=resp[parseInt(a,10)-1];if(r)h=r.id;
  }
  await guard(async()=>{await wPostUpd(id,{done:true,helper:h});if(h)await wThanks(id,h)});
  render();
}
async function delPost(id){if(confirm(t("delConfirm").split("?")[0]+"?")){await guard(()=>wPostDel(id));render()}}
async function reportPost(id){
  const p=ST.posts.find(x=>x.id===id),r=prompt(t("reportPrompt"));
  if(!p||!r)return;
  await guard(()=>wReport({kind:"post",target:id,reporter:CU,reason:r.slice(0,200),text:String(p.text||"").slice(0,200),t:Date.now()}));
  alert(t("reported"));
}
async function reportUser(id){
  const u=ST.profiles[id],r=prompt(t("reportPrompt"));
  if(!u||!r)return;
  await guard(()=>wReport({kind:"user",target:id,reporter:CU,reason:r.slice(0,200),text:String(u.name||"").slice(0,100),t:Date.now()}));
  alert(t("reported"));
}

}

}
function voice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("#micst").textContent=t("micNo");return}
  const r=new SR();r.lang=lang==="mr"?"mr-IN":"en-IN";r.interimResults=false;
  $("#mic").classList.add("rec");$("#micst").textContent=t("micOn");
  r.onresult=e=>{const ta=$("#pt");ta.value=(ta.value?ta.value+" ":"")+e.results[0][0].transcript};
  r.onerror=()=>{const s=$("#micst");if(s)s.textContent=t("micFail")};
  r.onend=()=>{const m=$("#mic");if(m)m.classList.remove("rec");const s=$("#micst");if(s&&s.textContent===t("micOn"))s.textContent=""};
  r.start();
}

if(ONLINE){
  firebase.initializeApp(CONFIG.firebase);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(u=>{
    authReady=true;CU=u?u.uid:null;
    if(CU)startListeners();
    else{stopListeners();ready=false;ST={profiles:{},posts:[],vouches:[],thanks:[],reports:[],admin:false}}
    render();
  });
}else{
  CU=loadLocal();ready=true;ST.admin=true;
}
render();
</script>
